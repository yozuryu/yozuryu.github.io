<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Yozuryu</title>
    <meta name="description" content="Yozuryu's home page: Savepoint and Cheevodex, and a summary of the games played, in five JRPG menu themes.">
    <meta name="theme-color" content="#060b1c">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yozuryu.github.io/">
    <meta property="og:title" content="Yozuryu">
    <meta property="og:description" content="Weekend adventurer. Hours played, unlocks and completions across RetroAchievements, Steam and Xbox, and the things I built around them.">
    <meta property="og:image" content="https://yozuryu.github.io/assets/share/starlit-link.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://yozuryu.github.io/assets/share/starlit-link.jpg">
    <link rel="icon" href="./assets/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="./assets/root.css">
    <!-- The theme is known before the first paint, so the page never flashes another theme's background.
         Storage is shared with the project sites: every key here starts with root_ -->
    <script>
        (function () {
            var bg = { starlit: '#060b1c', load: '#0b1416', quest: '#1c120c', stylish: '#f3efe6', noah: '#cfe6d3' };
            var t = new URLSearchParams(location.search).get('theme');
            try { t = t || localStorage.getItem('root_theme'); } catch (e) {}
            if (!bg[t]) t = 'starlit';
            document.documentElement.dataset.theme = t;
            document.documentElement.style.background = bg[t];
        })();
    </script>
    <style id="theme-css"></style>
</head>
<body>
    <div id="root"></div>
    <div class="rt" id="switch"></div>
    <noscript><p style="padding:24px;color:#fff;font-family:sans-serif">Yozuryu's home page. Projects: <a href="/my-savepoint/">Savepoint</a>, <a href="/cheevodex/">Cheevodex</a>.</p></noscript>
    <script type="module" src="./app.js"></script>
    <!-- No service worker here on purpose: this site owns the "/" scope of
         yozuryu.github.io, so a worker registered here would also intercept
         requests for /my-savepoint/ and /cheevodex/. -->
</body>
</html>
